<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lead Scraper — Login</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      background: #f3f4f6;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      padding: 44px 40px 36px;
      width: 380px;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      color: #111;
      text-align: center;
      margin-bottom: 28px;
      letter-spacing: -0.3px;
    }
    input[type="password"] {
      display: block;
      width: 100%;
      padding: 11px 14px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 15px;
      color: #111;
      outline: none;
      transition: border-color 0.15s;
    }
    input[type="password"]:focus { border-color: #4f46e5; }
    button {
      display: block;
      width: 100%;
      margin-top: 12px;
      padding: 11px;
      background: #4f46e5;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    button:hover { background: #4338ca; }
    .error {
      margin-top: 14px;
      color: #dc2626;
      font-size: 14px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Lead Scraper</h1>
    <form method="POST" action="/login">
      <input type="password" name="password" placeholder="Password" autofocus required>
      <button type="submit">Enter</button>
    </form>
    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}
  </div>
</body>
</html>
